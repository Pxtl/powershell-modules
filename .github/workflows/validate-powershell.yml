# this workflow uses https://github.com/microsoft/action-psscriptanalyzer . For
# more information on PSScriptAnalyzer in general, see
# https://github.com/PowerShell/PSScriptAnalyzer

name: Powershell CI
run-name: >-
  Validate 
  ${{ github.event_name == 'push' && format('— {0}', github.event.head_commit.message) 
    || github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) 
    || github.event_name == 'schedule' && 'Scheduled' 
    || github.event_name == 'workflow_dispatch' && 'Manual Dispatch' 
    || github.event_name == 'workflow_run' && format('— {0}', github.event.workflow_run.display_title)
    || format('CI Run for commit {0}', github.sha)
  }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '28 7 * * 4'

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f
        with:
          # Check https://github.com/microsoft/action-psscriptanalyzer for more info about the options.
          # The below set up runs PSScriptAnalyzer to your entire repository and runs some basic security rules.
          path: .\src\
          recurse: true
          # Include your own basic security rules. Removing this option will run all the rules
          includeRule: '"PSAvoidGlobalAliases", "PSAvoidUsingConvertToSecureStringWithPlainText"'
          output: results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Install Pester
        shell: powershell
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser

      - name: Run Pester Unit Tests
        shell: powershell
        run: |
          $modules = Get-ChildItem -Directory -Path ./src
          foreach ($module in $modules) {
            $testPath = Join-Path $module.FullName 'Tests'
            if (Test-Path $testPath) {
              "Running tests for module: $($module.Name)..."
              Invoke-Pester -Path "$testPath\*.tests.ps1" -Output Detailed
            } else {
              "No tests found for module: $($module.Name). Skipping."
            }
          }

      - name: docker compose smblds
        uses: hoverkraft-tech/compose-action@v1.5.1
        with:
          compose-file: "./src/ADServices/Tests/Integration/adservices-testdocker/docker-compose.yml"
          services: smblds
          up-flags: wait

      - name: Run Pester ADServices Integration Tests
        shell: powershell
        run: |
          $Server = 'localhost:389'
          $PSCredential = [PSCredential]::new('Administrator', (ConvertTo-SecureString 'Passw0rd' -AsPlainText -Force))

          Invoke-Pester -Container (New-PesterContainer -ScriptBlock {
            $testsPath = '.\src\ADServices\Tests\Integration'
            ForEach ($testPath in Get-ChildItem $testsPath -Filter "*.tests.ps1") {
              & $testPath.FullName -Server $Server -PSCredential $PSCredential
            }
          })